openapi: 3.0.3
info:
  title: ms-transaction API
  description: |
    Transactions API of the banking system: deposits and withdrawals on accounts, payments and
    consumptions on credit products, balances and movements. Balances are owned by this service.
    Balance meaning: accounts = available money; loans = outstanding debt; credit cards = consumed amount.
  version: 1.0.0
servers:
  - url: http://localhost:8084/api/v1
    description: Local
tags:
  - name: Account transactions
  - name: Credit transactions

paths:
  /transactions/accounts/{accountId}/deposits:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Account transactions]
      summary: Deposit money into an account
      description: |
        Account type rules: SAVINGS rejects the movement when the monthly movement limit is reached;
        FIXED_TERM only accepts one movement per month, on its movementDayOfMonth; CHECKING has no limits.
      operationId: deposit
      requestBody:
        $ref: '#/components/requestBodies/Operation'
      responses:
        '201':
          $ref: '#/components/responses/MovementCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transactions/accounts/{accountId}/withdrawals:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Account transactions]
      summary: Withdraw money from an account
      description: Same account type rules as deposits. The balance cannot become negative.
      operationId: withdraw
      requestBody:
        $ref: '#/components/requestBodies/Operation'
      responses:
        '201':
          $ref: '#/components/responses/MovementCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transactions/accounts/{accountId}/balance:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Account transactions]
      summary: Get the available balance of an account
      operationId: findAccountBalance
      responses:
        '200':
          description: Account balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceResponseDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transactions/accounts/{accountId}/movements:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Account transactions]
      summary: List the movements of an account (newest first)
      operationId: findAccountMovements
      responses:
        '200':
          $ref: '#/components/responses/MovementList'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transactions/credits/{creditId}/payments:
    parameters:
      - $ref: '#/components/parameters/CreditId'
    post:
      tags: [Credit transactions]
      summary: Pay a credit product (loan or credit card)
      description: The payment cannot exceed the outstanding debt.
      operationId: pay
      requestBody:
        $ref: '#/components/requestBodies/Operation'
      responses:
        '201':
          $ref: '#/components/responses/MovementCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transactions/credits/{creditId}/consumptions:
    parameters:
      - $ref: '#/components/parameters/CreditId'
    post:
      tags: [Credit transactions]
      summary: Charge a consumption to a credit card
      description: Only credit cards accept consumptions, and the consumed amount cannot exceed the credit limit.
      operationId: consume
      requestBody:
        $ref: '#/components/requestBodies/Operation'
      responses:
        '201':
          $ref: '#/components/responses/MovementCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transactions/credits/{creditId}/balance:
    parameters:
      - $ref: '#/components/parameters/CreditId'
    get:
      tags: [Credit transactions]
      summary: Get the outstanding debt and available credit of a credit product
      operationId: findCreditBalance
      responses:
        '200':
          description: Credit balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalanceResponseDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transactions/credits/{creditId}/movements:
    parameters:
      - $ref: '#/components/parameters/CreditId'
    get:
      tags: [Credit transactions]
      summary: List the movements of a credit product (newest first)
      operationId: findCreditMovements
      responses:
        '200':
          $ref: '#/components/responses/MovementList'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
      example: 6650f1c2a1b2c3d4e5f60718
    CreditId:
      name: creditId
      in: path
      required: true
      schema:
        type: string
      example: 6650f1c2a1b2c3d4e5f60719

  requestBodies:
    Operation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationRequestDto'

  responses:
    MovementCreated:
      description: Movement registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MovementResponseDto'
    MovementList:
      description: List of movements, newest first (empty if there are none)
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MovementResponseDto'
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
    NotFound:
      description: Account or credit not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
    Conflict:
      description: The balance was modified concurrently, retry the operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
    UnprocessableEntity:
      description: Business rule violated (insufficient funds, limits, day not allowed, payment above debt, consumption not allowed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
    ServiceUnavailable:
      description: ms-account or ms-credit is not available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'

  schemas:
    ProductCategoryEnum:
      type: string
      enum: [ACCOUNT, CREDIT]
    AccountTypeEnum:
      type: string
      enum: [SAVINGS, CHECKING, FIXED_TERM]
    CreditTypeEnum:
      type: string
      enum: [LOAN, CREDIT_CARD]
    MovementTypeEnum:
      type: string
      enum: [DEPOSIT, WITHDRAWAL, PAYMENT, CONSUMPTION]

    OperationRequestDto:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Up to 12 integer digits and 2 decimals
          example: 250.00
        description:
          type: string
          maxLength: 100
          example: Salary deposit

    MovementResponseDto:
      type: object
      properties:
        id:
          type: string
        productCategory:
          $ref: '#/components/schemas/ProductCategoryEnum'
        productId:
          type: string
        type:
          $ref: '#/components/schemas/MovementTypeEnum'
        amount:
          type: number
        balanceAfter:
          type: number
          description: Product balance after the movement (money for accounts, debt for credits)
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    AccountBalanceResponseDto:
      type: object
      properties:
        accountId:
          type: string
        accountType:
          $ref: '#/components/schemas/AccountTypeEnum'
        balance:
          type: number

    CreditBalanceResponseDto:
      type: object
      properties:
        creditId:
          type: string
        creditType:
          $ref: '#/components/schemas/CreditTypeEnum'
        outstandingDebt:
          type: number
        availableCredit:
          type: number
          nullable: true
          description: Credit limit minus consumed amount. Null for loans

    ErrorResponseDto:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string